<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Company Fantasy Hub</title>
<style>
:root{--bg:#0b0e13;--panel:#141923;--panel2:#1b2230;--text:#f5f7fb;--muted:#98a2b3;--accent:#00ceb8;--line:#293244;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 16px 50px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}.eyebrow{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:12px}h1{margin:4px 0 4px;font-size:clamp(26px,5vw,42px)}.sub{color:var(--muted);font-size:14px}.tabs{display:flex;gap:8px;margin:24px 0 18px;overflow:auto;padding-bottom:3px}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 16px;border-radius:999px;font-weight:700;white-space:nowrap}.tab.active{background:var(--accent);color:#06110f;border-color:var(--accent)}.tab:disabled{opacity:.4}.status{padding:14px 16px;border:1px solid var(--line);background:var(--panel);border-radius:14px;color:var(--muted);margin:12px 0}.status.error{border-color:#663b42;color:#ffb3b3}.grid{display:grid;grid-template-columns:1.4fr .9fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}.card h2{font-size:18px;margin:0 0 14px}.matchups{display:grid;gap:10px}.match{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px}.teamrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:7px 2px}.teamrow+.teamrow{border-top:1px solid var(--line)}.teamname{font-weight:750}.manager{font-size:12px;color:var(--muted);margin-top:2px}.score{font-size:20px;font-variant-numeric:tabular-nums;font-weight:850}.winner .score{color:var(--accent)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.rank{font-weight:800;color:var(--muted)}.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(max-width:540px){.teams{grid-template-columns:1fr}}.teamcard{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px}.clickteam{cursor:pointer;width:100%;color:inherit;text-align:left;font:inherit}.clickteam:hover{border-color:var(--accent)}.teamlink{cursor:pointer}.rosterpanel{margin-top:18px}.rosterhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.closebtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 11px;font-weight:800}.playergrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}@media(max-width:540px){.playergrid{grid-template-columns:1fr}}.player{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}.pos{font-weight:900;color:var(--accent);font-size:12px}.nfl{color:var(--muted);font-size:12px}.starter{font-size:10px;font-weight:900;border:1px solid #14534c;color:var(--accent);border-radius:999px;padding:3px 6px}.bench{opacity:.82}.pill{display:inline-block;color:var(--accent);background:#0d2a27;border:1px solid #14534c;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;margin-top:8px}.footer{color:var(--muted);font-size:12px;text-align:center;margin-top:22px}.hidden{display:none}.weekctl{display:flex;gap:8px;align-items:center}.weekctl button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 11px;font-weight:800}.weekctl button:disabled{opacity:.35}.weeklabel{font-weight:800;min-width:76px;text-align:center}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><div class="eyebrow">Fantasy Football</div><h1 id="leagueName">Company Fantasy Hub</h1><div class="sub" id="leagueMeta">Division 1 · Sleeper</div></div><div class="weekctl"><button id="prev">‹</button><span class="weeklabel" id="weekLabel">Week –</span><button id="next">›</button></div></div>
<div class="tabs"><button class="tab active">Division 1</button><button class="tab" disabled>Division 2</button><button class="tab" disabled>Division 3</button><button class="tab" disabled>Division 4</button></div>
<div id="status" class="status">Verbinde mit Sleeper …</div>
<section id="content" class="hidden"><div class="grid"><div class="card"><h2>Matchups</h2><div id="matchups" class="matchups"></div></div><div class="card"><h2>Standings</h2><div style="overflow:auto"><table><thead><tr><th>#</th><th>Team</th><th class="num">W-L</th><th class="num">PF</th></tr></thead><tbody id="standings"></tbody></table></div></div></div><div class="card" style="margin-top:18px"><h2>Teams & Manager</h2><div id="teams" class="teams"></div></div><div id="rosterPanel" class="card rosterpanel hidden"><div class="rosterhead"><div><h2 id="rosterTitle" style="margin-bottom:3px">Roster</h2><div id="rosterManager" class="manager"></div></div><button id="closeRoster" class="closebtn">Schließen</button></div><div id="rosterStatus" class="status hidden"></div><div id="players" class="playergrid"></div></div></section>
<div class="footer">Daten direkt aus der offiziellen Sleeper API · Nur Lesezugriff</div>
</main>
<script>
const LEAGUES={1:'1396450252243890176'}; const API='https://api.sleeper.app/v1'; let currentWeek=1, maxWeek=18; let users={},rosters=[],league={},playersCache=null;
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function j(path){const r=await fetch(API+path);if(!r.ok)throw new Error('Sleeper API: '+r.status);return r.json()}
function teamInfo(rid){const r=rosters.find(x=>x.roster_id===rid); if(!r)return {name:'Unbekannt',manager:''}; const u=users[r.owner_id]||{}; const name=(r.metadata&&r.metadata.team_name)||u.metadata?.team_name||u.display_name||('Team '+rid); return {name,manager:u.display_name||''}}
function record(r){const s=r.settings||{};return `${s.wins||0}-${s.losses||0}${s.ties?'-'+s.ties:''}`}
function pf(r){const s=r.settings||{};return ((s.fpts||0)+(s.fpts_decimal||0)/100).toFixed(2)}
async function init(){try{const id=LEAGUES[1]; const [l,u,r,state]=await Promise.all([j('/league/'+id),j('/league/'+id+'/users'),j('/league/'+id+'/rosters'),j('/state/nfl')]); league=l; users=Object.fromEntries(u.map(x=>[x.user_id,x])); rosters=r; currentWeek=Math.max(1,Number(state.week)||1); $('#leagueName').textContent=l.name||'Company Fantasy Hub'; $('#leagueMeta').textContent=`Division 1 · ${r.length} Teams · Saison ${l.season||''}`; renderStandings();renderTeams();await loadWeek();$('#content').classList.remove('hidden');$('#status').classList.add('hidden')}catch(e){$('#status').className='status error';$('#status').innerHTML='<b>Daten konnten nicht geladen werden.</b><br>Öffne die Datei mit Internetzugang. Falls dein Browser lokale HTML-Dateien beim API-Zugriff blockiert, funktioniert dieselbe Datei nach Veröffentlichung über GitHub Pages.';console.error(e)}}
async function loadWeek(){ $('#weekLabel').textContent='Week '+currentWeek; $('#prev').disabled=currentWeek<=1; $('#next').disabled=currentWeek>=maxWeek; const data=await j('/league/'+LEAGUES[1]+'/matchups/'+currentWeek); const groups={}; for(const m of data){if(!groups[m.matchup_id])groups[m.matchup_id]=[];groups[m.matchup_id].push(m)} const el=$('#matchups');el.innerHTML=''; const entries=Object.values(groups).filter(g=>g.length); if(!entries.length){el.innerHTML='<div class="status">Für diese Woche sind noch keine Matchups vorhanden.</div>';return} entries.sort((a,b)=>(a[0].matchup_id||99)-(b[0].matchup_id||99)); for(const g of entries){const d=document.createElement('div');d.className='match'; const sorted=[...g].sort((a,b)=>(b.points||0)-(a.points||0)); d.innerHTML=sorted.map((m,i)=>{const t=teamInfo(m.roster_id);return `<div class="teamrow ${g.length>1&&i===0&&Number(sorted[0].points)!==Number(sorted[1].points)?'winner':''}"><div><div class="teamname teamlink" data-rid="${m.roster_id}">${esc(t.name)}</div><div class="manager">${esc(t.manager)}</div></div><div class="score">${Number(m.points||0).toFixed(2)}</div></div>`}).join('');el.appendChild(d)} el.querySelectorAll('[data-rid]').forEach(x=>x.addEventListener('click',()=>showRoster(Number(x.dataset.rid))))}}
async function getPlayers(){if(playersCache)return playersCache; playersCache=await j('/players/nfl'); return playersCache}
async function showRoster(rid){const r=rosters.find(x=>x.roster_id===rid);if(!r)return;const t=teamInfo(rid);$('#rosterTitle').textContent=t.name;$('#rosterManager').textContent='Manager: '+(t.manager||'–');$('#players').innerHTML='';$('#rosterPanel').classList.remove('hidden');$('#rosterStatus').className='status';$('#rosterStatus').textContent='Lade Roster …';$('#rosterStatus').classList.remove('hidden');$('#rosterPanel').scrollIntoView({behavior:'smooth',block:'start'});try{const ps=await getPlayers();const starters=new Set(r.starters||[]);const ids=r.players||[];const rows=ids.map(id=>{const p=ps[id]||{};return {id,name:p.full_name||p.first_name+' '+p.last_name||id,pos:p.position||'–',team:p.team||'FA',starter:starters.has(id)}}).sort((a,b)=>Number(b.starter)-Number(a.starter)||a.pos.localeCompare(b.pos)||a.name.localeCompare(b.name));$('#players').innerHTML=rows.map(p=>`<div class="player ${p.starter?'':'bench'}"><div class="pos">${esc(p.pos)}</div><div><b>${esc(p.name)}</b><div class="nfl">${esc(p.team)}</div></div>${p.starter?'<span class="starter">START</span>':'<span class="nfl">BENCH</span>'}</div>`).join('')||'<div class="status">Keine Spieler gefunden.</div>';$('#rosterStatus').classList.add('hidden')}catch(e){$('#rosterStatus').className='status error';$('#rosterStatus').textContent='Roster konnte nicht geladen werden.'}}
function renderStandings(){const arr=[...rosters].sort((a,b)=>{const A=a.settings||{},B=b.settings||{};return (B.wins||0)-(A.wins||0)||((B.fpts||0)+(B.fpts_decimal||0)/100)-((A.fpts||0)+(A.fpts_decimal||0)/100)});$('#standings').innerHTML=arr.map((r,i)=>{const t=teamInfo(r.roster_id);return `<tr class="teamlink" data-rid="${r.roster_id}"><td class="rank">${i+1}</td><td><b>${esc(t.name)}</b><div class="manager">${esc(t.manager)}</div></td><td class="num">${record(r)}</td><td class="num">${pf(r)}</td></tr>`}).join('')}
function renderTeams(){const arr=[...rosters].sort((a,b)=>teamInfo(a.roster_id).name.localeCompare(teamInfo(b.roster_id).name));$('#teams').innerHTML=arr.map(r=>{const t=teamInfo(r.roster_id);return `<button class="teamcard clickteam" data-rid="${r.roster_id}"><div class="teamname">${esc(t.name)}</div><div class="manager">Manager: ${esc(t.manager||'–')}</div><span class="pill">${record(r)} · ${pf(r)} PF</span></button>`}).join(''); document.querySelectorAll('[data-rid]').forEach(el=>el.addEventListener('click',()=>showRoster(Number(el.dataset.rid))))}
$('#closeRoster').addEventListener('click',()=>$('#rosterPanel').classList.add('hidden'));
$('#prev').addEventListener('click',async()=>{if(currentWeek>1){currentWeek--;await loadWeek()}});$('#next').addEventListener('click',async()=>{if(currentWeek<maxWeek){currentWeek++;await loadWeek()}});init();
</script></body></html>
