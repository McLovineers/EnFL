<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Fantasy Hub</title>
<style>
:root{--bg:#0b0e13;--panel:#141923;--panel2:#1b2230;--panel3:#222b3a;--text:#f5f7fb;--muted:#98a2b3;--accent:#00ceb8;--line:#293244;--danger:#ff5277}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px 16px 50px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}.eyebrow{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:12px}h1{margin:4px 0;font-size:clamp(26px,5vw,42px)}.sub,.manager,.nfl,.footer{color:var(--muted)}.sub{font-size:14px}.tabs{display:flex;gap:8px;margin:24px 0 18px;overflow:auto}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 16px;border-radius:999px;font-weight:700;white-space:nowrap}.tab.active{background:var(--accent);color:#06110f;border-color:var(--accent)}.tab:disabled{opacity:.4}.status{padding:14px 16px;border:1px solid var(--line);background:var(--panel);border-radius:14px;color:var(--muted);margin:12px 0}.status.error{border-color:#663b42;color:#ffb3b3}.grid{display:grid;grid-template-columns:1.45fr .8fr;gap:18px}@media(max-width:850px){.grid{grid-template-columns:1fr}}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}.card h2{font-size:18px;margin:0 0 14px}.matchups{display:grid;gap:12px}.match{background:var(--panel2);border:1px solid var(--line);border-radius:16px;overflow:hidden}.matchsummary{width:100%;border:0;background:transparent;color:inherit;padding:16px;cursor:pointer;font:inherit}.matchsummary:hover{background:rgba(255,255,255,.018)}.versus{display:grid;grid-template-columns:minmax(0,1fr) auto 44px auto minmax(0,1fr);align-items:center;gap:10px}.side{min-width:0;display:flex;align-items:center;gap:9px}.side.right{justify-content:flex-end}.teamtext{min-width:0}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--panel);border:1px solid var(--line);flex:0 0 auto}.avatar.sm{width:28px;height:28px}.standteam{display:flex;align-items:center;gap:8px}.playerline{display:flex;align-items:center;gap:8px;min-width:0}.playerline.right{justify-content:flex-end}.playerpic{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--panel2);flex:0 0 auto}.playertext{min-width:0}.tradePlayer{display:flex;align-items:center;gap:8px;margin-top:7px}.tradePlayer .playerpic{width:30px;height:30px}.side.right{text-align:right}.teamname{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.manager{font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}.score.lead{color:var(--accent)}.vs{height:40px;width:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:#687386;font-weight:900;font-size:12px}.chev{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}.matchdetail{border-top:1px solid var(--line);padding:12px;background:#10151e}.detailstatus{text-align:center;color:var(--muted);padding:12px}.starterhead,.starterrow{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);align-items:stretch}.starterhead{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 4px 8px}.starterhead div:last-child{text-align:right}.starterrow{border-top:1px solid var(--line)}.pbox{padding:10px 8px;min-width:0}.pbox.right{text-align:right}.pname{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pmeta{font-size:11px;color:var(--muted);margin-top:3px}.ppoints{font-weight:900;color:var(--accent);margin-left:7px}.right .ppoints{margin-left:0;margin-right:7px}.slot{display:grid;place-items:center;font-size:10px;font-weight:900;background:var(--panel2);border-left:1px solid var(--line);border-right:1px solid var(--line)}.pos-QB{color:#ff5277}.pos-RB{color:#00ceb8}.pos-WR{color:#58a6ff}.pos-TE{color:#f6c453}.pos-WRRB,.pos-FLEX,.pos-REC_FLEX{color:#a78bfa}.pos-BN{color:#98a2b3}.sectiontabs{display:flex;gap:6px;margin:-4px 0 12px}.sectiontab{border:1px solid var(--line);background:var(--panel2);color:var(--muted);padding:7px 11px;border-radius:9px;font-weight:800;cursor:pointer}.sectiontab.active{color:#07110f;background:var(--accent);border-color:var(--accent)}.trade{border-top:1px solid var(--line);padding:11px 2px}.trade:first-child{border-top:0}.tradeTeams{font-weight:800}.tradeMeta,.tradeLine{color:var(--muted);font-size:12px;margin-top:4px}.tradeLine b{color:var(--text)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.rank{font-weight:800;color:var(--muted)}.weekctl{display:flex;gap:8px;align-items:center}.weekctl button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 11px;font-weight:800}.weekctl button:disabled{opacity:.35}.weeklabel{font-weight:800;min-width:76px;text-align:center}.footer{font-size:12px;text-align:center;margin-top:22px}.hidden{display:none}@media(max-width:600px){.versus{grid-template-columns:minmax(0,1fr) auto 30px auto minmax(0,1fr);gap:5px}.matchsummary{padding:12px 9px}.score{font-size:16px}.vs{width:28px;height:28px;font-size:9px}.teamname{font-size:13px}.manager{font-size:10px}.pbox{padding:9px 5px}.pname{font-size:12px}.pmeta{font-size:10px}.starterrow,.starterhead{grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr)}}

/* V6 mobile/Sleeper-style roster refinements */
.score.lose{color:var(--danger)}
.playertext{display:flex;flex-direction:column;min-width:0}
.pname{font-size:14px;line-height:1.15}
.ppoints{display:block;margin:3px 0 0!important;font-size:12px;line-height:1.1;color:var(--accent)}
.pmeta{font-size:10px;margin-top:3px}
@media(max-width:600px){.wrap{padding:14px 8px 36px}.card{padding:10px;border-radius:14px}.matchdetail{padding:8px}.playerpic{width:32px;height:32px}.playerline{gap:6px}.pbox{padding:8px 4px}.pname{font-size:11.5px;line-height:1.15}.ppoints{font-size:10.5px;margin-top:2px!important}.pmeta{font-size:9.5px;line-height:1.15}.slot{font-size:9px}.starterhead{font-size:10px}.starterrow,.starterhead{grid-template-columns:minmax(0,1fr) 32px minmax(0,1fr)}}
</style></head><body><main class="wrap">
<div class="top"><div><div class="eyebrow">Fantasy Football</div><h1 id="leagueName">Company Fantasy Hub</h1><div class="sub" id="leagueMeta">Division 1 · Sleeper</div></div><div class="weekctl"><button id="prev">‹</button><span class="weeklabel" id="weekLabel">Week –</span><button id="next">›</button></div></div>
<div class="tabs"><button class="tab active">Division 1</button><button class="tab" disabled>Division 2</button><button class="tab" disabled>Division 3</button><button class="tab" disabled>Division 4</button></div>
<div id="status" class="status">Verbinde mit Sleeper …</div>
<section id="content" class="hidden"><div class="grid"><div class="card"><h2>Matchups</h2><div id="matchups" class="matchups"></div></div><div class="card"><h2>League</h2><div class="sectiontabs"><button id="standingsTab" class="sectiontab active">Standings</button><button id="tradesTab" class="sectiontab">Trades</button></div><div id="standingsView" style="overflow:auto"><table><thead><tr><th>#</th><th>Team</th><th class="num">W-L</th><th class="num">PF</th></tr></thead><tbody id="standings"></tbody></table></div><div id="tradesView" class="hidden"><div id="trades" class="detailstatus">Trades laden …</div></div></div></div></section>
<div class="footer">Daten direkt aus der offiziellen Sleeper API · Nur Lesezugriff</div></main>
<script>
const LEAGUES={1:'1396450252243890176'},API='https://api.sleeper.app/v1';let currentWeek=1,maxWeek=18,users={},rosters=[],league={},playersCache=null,matchupCache=[];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function avatarUrl(u){return u?.avatar?`https://sleepercdn.com/avatars/thumbs/${encodeURIComponent(u.avatar)}`:''}
function playerImg(id){return id?`https://sleepercdn.com/content/nfl/players/thumb/${encodeURIComponent(id)}.jpg`:''}
function imgTag(src,cls='avatar',alt=''){return src?`<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.style.display='none'">`:''}
async function j(path,timeout=12000){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch(API+path,{signal:ctl.signal});if(!r.ok)throw new Error(path+' → HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}
function teamInfo(rid){const r=rosters.find(x=>x.roster_id===rid);if(!r)return{name:'Unbekannt',manager:'',avatar:''};const u=users[r.owner_id]||{};return{name:r.metadata?.team_name||u.metadata?.team_name||u.display_name||('Team '+rid),manager:u.display_name||'',avatar:avatarUrl(u)}}
function record(r){const s=r.settings||{};return `${s.wins||0}-${s.losses||0}${s.ties?'-'+s.ties:''}`}
function pf(r){const s=r.settings||{};return ((s.fpts||0)+(s.fpts_decimal||0)/100).toFixed(2)}
function renderStandings(){const arr=[...rosters].sort((a,b)=>{const A=a.settings||{},B=b.settings||{};return(B.wins||0)-(A.wins||0)||((B.fpts||0)+(B.fpts_decimal||0)/100)-((A.fpts||0)+(A.fpts_decimal||0)/100)});$('#standings').innerHTML=arr.map((r,i)=>{const t=teamInfo(r.roster_id);return `<tr><td class="rank">${i+1}</td><td><div class="standteam">${imgTag(t.avatar,'avatar sm',t.manager)}<div><b>${esc(t.name)}</b><div class="manager">${esc(t.manager)}</div></div></div></td><td class="num">${record(r)}</td><td class="num">${pf(r)}</td></tr>`}).join('')}
async function getPlayers(){if(playersCache)return playersCache;playersCache=await j('/players/nfl',25000);return playersCache}
function pointsFor(m,id){const v=m?.players_points?.[id];return Number(v??0).toFixed(2)}
function displaySlot(slot){return slot==='WRRB_FLEX'?'WRRB':slot}
function slotClass(slot){const x=displaySlot(slot);return 'pos-'+String(x).replace(/[^A-Z0-9_]/gi,'')}
function benchIds(m){const starters=new Set(m?.starters||[]);return (m?.players||[]).filter(id=>!starters.has(id))}
function playerCell(p,id,m,right=false){if(!id)return `<div class="pbox ${right?'right':''}"><div class="pname">–</div></div>`;const x=p[id]||{};const name=x.full_name||[x.first_name,x.last_name].filter(Boolean).join(' ')||id;const meta=[x.position,x.team].filter(Boolean).join(' · ');const pts=pointsFor(m,id);const pic=imgTag(playerImg(id),'playerpic',name);const text=`<div class="playertext"><div class="pname">${esc(name)}</div><span class="ppoints">${pts}</span><div class="pmeta">${esc(meta||'–')}</div></div>`;return `<div class="pbox ${right?'right':''}"><div class="playerline ${right?'right':''}">${right?text+pic:pic+text}</div></div>`}
async function toggleMatch(key,a,b,button){const detail=document.getElementById('detail-'+key);if(!detail)return;if(!detail.classList.contains('hidden')){detail.classList.add('hidden');button.querySelector('.chev').textContent='Kader anzeigen ▾';return}document.querySelectorAll('.matchdetail').forEach(x=>x.classList.add('hidden'));document.querySelectorAll('.chev').forEach(x=>x.textContent='Kader anzeigen ▾');detail.classList.remove('hidden');button.querySelector('.chev').textContent='Kader schließen ▴';if(detail.dataset.loaded)return;detail.innerHTML='<div class="detailstatus">Lade Spielerdaten …</div>';try{const p=await getPlayers();const slots=(league.roster_positions||[]).filter(x=>x!=='BN');const max=Math.max(a?.starters?.length||0,b?.starters?.length||0,slots.length);let html='<div class="starterhead"><div>Starter</div><div></div><div>Starter</div></div>';for(let i=0;i<max;i++){const raw=slots[i]||p[a?.starters?.[i]]?.position||p[b?.starters?.[i]]?.position||'FLEX',slot=displaySlot(raw);html+=`<div class="starterrow">${playerCell(p,a?.starters?.[i],a)}<div class="slot ${slotClass(slot)}">${esc(slot)}</div>${playerCell(p,b?.starters?.[i],b,true)}</div>`}const ab=benchIds(a),bb=benchIds(b),bm=Math.max(ab.length,bb.length);if(bm){html+='<div class="starterhead" style="padding-top:14px"><div>Bench</div><div></div><div>Bench</div></div>';for(let i=0;i<bm;i++)html+=`<div class="starterrow">${playerCell(p,ab[i],a)}<div class="slot pos-BN">BN</div>${playerCell(p,bb[i],b,true)}</div>`}detail.innerHTML=html;detail.dataset.loaded='1'}catch(e){detail.innerHTML=`<div class="detailstatus">Spielerdaten konnten nicht geladen werden: ${esc(e.message)}</div>`}}
async function loadWeek(){try{$('#weekLabel').textContent='Week '+currentWeek;$('#prev').disabled=currentWeek<=1;$('#next').disabled=currentWeek>=maxWeek;const data=await j('/league/'+LEAGUES[1]+'/matchups/'+currentWeek);matchupCache=data;const groups={};for(const m of data){const k=m.matchup_id??('solo-'+m.roster_id);(groups[k]??=[]).push(m)}const el=$('#matchups');el.innerHTML='';const entries=Object.entries(groups).filter(([,g])=>g.length);entries.sort((a,b)=>Number(a[0])-Number(b[0]));if(!entries.length){el.innerHTML='<div class="status">Für diese Woche sind noch keine Matchups vorhanden.</div>';return}for(const [key,g] of entries){const a=g[0],b=g[1]||null,ta=teamInfo(a.roster_id),tb=b?teamInfo(b.roster_id):{name:'Bye',manager:''},pa=Number(a.points||0),pb=Number(b?.points||0);const d=document.createElement('div');d.className='match';d.innerHTML=`<button class="matchsummary" type="button"><div class="versus"><div class="side">${imgTag(ta.avatar,'avatar',ta.manager)}<div class="teamtext"><div class="teamname">${esc(ta.name)}</div><div class="manager">${esc(ta.manager)}</div></div></div><div class="score ${b?(pa>pb?'lead':pa<pb?'lose':''):''}">${pa.toFixed(2)}</div><div class="vs">VS</div><div class="score ${b?(pb>pa?'lead':pb<pa?'lose':''):''}">${b?pb.toFixed(2):'–'}</div><div class="side right"><div class="teamtext"><div class="teamname">${esc(tb.name)}</div><div class="manager">${esc(tb.manager)}</div></div>${imgTag(tb.avatar,'avatar',tb.manager)}</div></div><div class="chev">${b?'Kader anzeigen ▾':''}</div></button><div id="detail-${esc(key)}" class="matchdetail hidden"></div>`;el.appendChild(d);if(b){const btn=d.querySelector('.matchsummary');btn.addEventListener('click',()=>toggleMatch(key,a,b,btn))}}}catch(e){$('#matchups').innerHTML=`<div class="status error">Matchups konnten nicht geladen werden: ${esc(e.message)}</div>`}}

function rosterName(rid){return teamInfo(Number(rid)).name}
async function loadTrades(){const el=$('#trades');el.innerHTML='Trades laden …';try{const tx=await j('/league/'+LEAGUES[1]+'/transactions/'+currentWeek);const trades=(tx||[]).filter(t=>t.type==='trade'&&t.status==='complete');if(!trades.length){el.innerHTML=`In Week ${currentWeek} gab es keine abgeschlossenen Trades.`;return}const p=await getPlayers();el.innerHTML=trades.sort((a,b)=>(b.created||0)-(a.created||0)).map(t=>{const teams=(t.roster_ids||[]).map(rosterName).join(' ↔ ');const adds=Object.entries(t.adds||{}).map(([pid,rid])=>`<div class="tradePlayer">${imgTag(playerImg(pid),'playerpic',p[pid]?.full_name||pid)}<div class="tradeLine"><b>${esc(rosterName(rid))}</b> erhält ${esc(p[pid]?.full_name||pid)}</div></div>`).join('');const picks=(t.draft_picks||[]).map(pk=>`<div class="tradeLine"><b>${esc(rosterName(pk.owner_id))}</b> erhält ${esc(pk.season+' Round '+pk.round+' Pick')}</div>`).join('');return `<div class="trade"><div class="tradeTeams">${esc(teams)}</div><div class="tradeMeta">Week ${currentWeek}</div>${adds}${picks}</div>`}).join('')}catch(e){el.innerHTML=`Trades konnten nicht geladen werden: ${esc(e.message)}`}}
function showLeagueView(which){const st=which==='standings';$('#standingsView').classList.toggle('hidden',!st);$('#tradesView').classList.toggle('hidden',st);$('#standingsTab').classList.toggle('active',st);$('#tradesTab').classList.toggle('active',!st);if(!st)loadTrades()}

async function init(){try{const id=LEAGUES[1];const [l,u,r,state]=await Promise.all([j('/league/'+id),j('/league/'+id+'/users'),j('/league/'+id+'/rosters'),j('/state/nfl')]);league=l;users=Object.fromEntries(u.map(x=>[x.user_id,x]));rosters=r;currentWeek=Math.max(1,Number(state.week)||1);$('#leagueName').textContent=l.name||'Company Fantasy Hub';$('#leagueMeta').textContent=`Division 1 · ${r.length} Teams · Saison ${l.season||''}`;renderStandings();$('#content').classList.remove('hidden');$('#status').classList.add('hidden');await loadWeek()}catch(e){$('#status').className='status error';$('#status').innerHTML=`<b>Daten konnten nicht geladen werden.</b><br>${esc(e.name==='AbortError'?'Zeitüberschreitung beim Sleeper-Aufruf.':e.message)}`;console.error(e)}}
$('#standingsTab').addEventListener('click',()=>showLeagueView('standings'));$('#tradesTab').addEventListener('click',()=>showLeagueView('trades'));
$('#prev').addEventListener('click',async()=>{if(currentWeek>1){currentWeek--;await loadWeek();if(!$('#tradesView').classList.contains('hidden'))await loadTrades()}});$('#next').addEventListener('click',async()=>{if(currentWeek<maxWeek){currentWeek++;await loadWeek();if(!$('#tradesView').classList.contains('hidden'))await loadTrades()}});init();
</script></body></html>
