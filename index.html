<script>
const LEAGUES={1:'1396450252243890176'},API='https://api.sleeper.app/v1';let currentWeek=1,maxWeek=18,users={},rosters=[],league={},playersCache=null,matchupCache=[];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function avatarUrl(u){return u?.avatar?`https://sleepercdn.com/avatars/thumbs/${encodeURIComponent(u.avatar)}`:''}
function playerImg(id){return id?`https://sleepercdn.com/content/nfl/players/thumb/${encodeURIComponent(id)}.jpg`:''}
function teamLogo(team){return team?`https://sleepercdn.com/images/team_logos/nfl/${encodeURIComponent(String(team).toLowerCase())}.png`:''}
function playerAsset(id,x={}){const pos=String(x.position||'').toUpperCase();const team=x.team||id;return pos==='DEF'?teamLogo(team):playerImg(id)}
function imgTag(src,cls='avatar',alt=''){return src?`<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.style.display='none'">`:''}
async function j(path,timeout=12000){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch(API+path,{signal:ctl.signal});if(!r.ok)throw new Error(path+' → HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}
function teamInfo(rid){const r=rosters.find(x=>x.roster_id===rid);if(!r)return{name:'Unbekannt',manager:'',avatar:''};const u=users[r.owner_id]||{};return{name:r.metadata?.team_name||u.metadata?.team_name||u.display_name||('Team '+rid),manager:u.display_name||'',avatar:avatarUrl(u)}}
function rosterName(rid){return teamInfo(Number(rid)).name}
function record(r){const s=r.settings||{};return `${s.wins||0}-${s.losses||0}${s.ties?'-'+s.ties:''}`}
function pf(r){const s=r.settings||{};return ((s.fpts||0)+(s.fpts_decimal||0)/100).toFixed(2)}
function renderStandings(){const arr=[...rosters].sort((a,b)=>{const A=a.settings||{},B=b.settings||{};return(B.wins||0)-(A.wins||0)||((B.fpts||0)+(B.fpts_decimal||0)/100)-((A.fpts||0)+(A.fpts_decimal||0)/100)});$('#standings').innerHTML=arr.map((r,i)=>{const t=teamInfo(r.roster_id);return `<tr><td class="rank">${i+1}</td><td><div class="standteam">${imgTag(t.avatar,'avatar sm',t.manager)}<div><b>${esc(t.name)}</b><div class="manager">${esc(t.manager)}</div></div></div></td><td class="num">${record(r)}</td><td class="num">${pf(r)}</td></tr>`}).join('')}
async function getPlayers(){if(playersCache)return playersCache;playersCache=await j('/players/nfl',25000);return playersCache}
function pointsFor(m,id){const v=m?.players_points?.[id];return Number(v??0).toFixed(2)}
function displaySlot(slot){return slot==='WRRB_FLEX'?'WRRB':slot}
function slotClass(slot){const x=displaySlot(slot);return 'pos-'+String(x).replace(/[^A-Z0-9_]/gi,'')}
function rosterForMatch(m){return rosters.find(r=>r.roster_id===m?.roster_id)||null}
function effectiveStarters(m){if(Array.isArray(m?.starters)&&m.starters.length)return m.starters;const r=rosterForMatch(m);return Array.isArray(r?.starters)?r.starters:[]}
function effectivePlayers(m){if(Array.isArray(m?.players)&&m.players.length)return m.players;const r=rosterForMatch(m);return Array.isArray(r?.players)?r.players:[]}
function benchIds(m){const starters=new Set(effectiveStarters(m));return effectivePlayers(m).filter(id=>!starters.has(id))}
function slotLabel(slot){const x=displaySlot(slot);return x==='WRRB'?'<span class="slotSplitWRRB"><span class="wr">WR</span><span class="rb">RB</span></span>':esc(x)}
function playerCell(p,id,m,right=false){if(!id)return `<div class="pbox ${right?'right':''}"><div class="pname">–</div></div>`;const x=p[id]||{};const name=x.full_name||[x.first_name,x.last_name].filter(Boolean).join(' ')||id;const meta=[x.position,x.team].filter(Boolean).join(' · ');const pts=pointsFor(m,id);const pic=imgTag(playerAsset(id,x),'playerpic',name);const text=`<div class="playertext"><div class="pname">${esc(name)}</div><span class="ppoints">${pts}</span><div class="pmeta">${esc(meta||'–')}</div></div>`;return `<div class="pbox ${right?'right':''}"><div class="playerline ${right?'right':''}">${right?text+pic:pic+text}</div></div>`}
async function toggleMatch(key,a,b,button){const detail=document.getElementById('detail-'+key);if(!detail)return;const isOpen=detail.classList.contains('open');document.querySelectorAll('.matchdetail.open').forEach(x=>x.classList.remove('open'));document.querySelectorAll('.chev').forEach(x=>x.textContent='Kader anzeigen ▾');if(isOpen)return;detail.classList.remove('hidden');requestAnimationFrame(()=>detail.classList.add('open'));button.querySelector('.chev').textContent='Kader schließen ▴';if(detail.dataset.loaded)return;detail.innerHTML='<div class="detailstatus">Lade Spielerdaten …</div>';try{const p=await getPlayers();const slots=(league.roster_positions||[]).filter(x=>x!=='BN');const as=effectiveStarters(a),bs=effectiveStarters(b);const max=Math.max(as.length,bs.length,slots.length);let html='<div class="starterhead"><div>Starter</div><div></div><div>Starter</div></div>';for(let i=0;i<max;i++){const aid=as[i]||null,bid=bs[i]||null;const raw=slots[i]||p[aid]?.position||p[bid]?.position||'FLEX',slot=displaySlot(raw);html+=`<div class="starterrow">${playerCell(p,aid,a)}<div class="slot ${slotClass(slot)}">${slotLabel(slot)}</div>${playerCell(p,bid,b,true)}</div>`}const ab=benchIds(a),bb=benchIds(b),bm=Math.max(ab.length,bb.length);if(bm){html+='<div class="starterhead" style="padding-top:14px"><div>Bench</div><div></div><div>Bench</div></div>';for(let i=0;i<bm;i++)html+=`<div class="starterrow">${playerCell(p,ab[i],a)}<div class="slot pos-BN">BN</div>${playerCell(p,bb[i],b,true)}</div>`}detail.innerHTML=html;detail.dataset.loaded='1'}catch(e){detail.innerHTML=`<div class="detailstatus">Spielerdaten konnten nicht geladen werden: ${esc(e.message)}</div>`}}
async function loadWeek(){try{$('#weekLabel').textContent='Week '+currentWeek;$('#prev').disabled=currentWeek<=1;$('#next').disabled=currentWeek>=maxWeek;const data=await j('/league/'+LEAGUES[1]+'/matchups/'+currentWeek);matchupCache=data;const groups={};for(const m of data){const k=m.matchup_id??('solo-'+m.roster_id);(groups[k]??=[]).push(m)}const el=$('#matchups');el.innerHTML='';const entries=Object.entries(groups).filter(([,g])=>g.length);entries.sort((a,b)=>Number(a[0])-Number(b[0]));if(!entries.length){el.innerHTML='<div class="status">Für diese Woche sind noch keine Matchups vorhanden.</div>';return}for(const [key,g] of entries){const a=g[0],b=g[1]||null,ta=teamInfo(a.roster_id),tb=b?teamInfo(b.roster_id):{name:'Bye',manager:''},pa=Number(a.points||0),pb=Number(b?.points||0);const d=document.createElement('div');d.className='match';d.innerHTML=`<button class="matchsummary" type="button"><div class="versus"><div class="matchTeam">${imgTag(ta.avatar,'avatar',ta.manager)}<div class="teamname">${esc(ta.name)}</div><div class="manager">${esc(ta.manager)}</div></div><div class="score ${b?(pa>pb?'lead':pa<pb?'lose':''):''}">${pa.toFixed(2)}</div><div class="vs">VS</div><div class="score ${b?(pb>pa?'lead':pb<pa?'lose':''):''}">${b?pb.toFixed(2):'–'}</div><div class="matchTeam">${imgTag(tb.avatar,'avatar',tb.manager)}<div class="teamname">${esc(tb.name)}</div><div class="manager">${esc(tb.manager)}</div></div></div><div class="chev">${b?'Kader anzeigen ▾':''}</div></button><div id="detail-${esc(key)}" class="matchdetail hidden"></div>`;el.appendChild(d);if(b){const btn=d.querySelector('.matchsummary');btn.addEventListener('click',()=>toggleMatch(key,a,b,btn))}}}catch(e){$('#matchups').innerHTML=`<div class="status error">Matchups konnten nicht geladen werden: ${esc(e.message)}</div>`}}

function standingsOrder(){return [...rosters].sort((a,b)=>{const A=a.settings||{},B=b.settings||{};return(B.wins||0)-(A.wins||0)||((B.fpts||0)+(B.fpts_decimal||0)/100)-((A.fpts||0)+(A.fpts_decimal||0)/100)})}
function treeTeam(r,seed){const t=teamInfo(r.roster_id);return `<div class="treeTeam">${imgTag(t.avatar,'avatar',t.manager)}<div class="treeSeed">${seed}</div><div style="min-width:0"><div class="treeName">${esc(t.name)}</div><div class="treeManager">${esc(t.manager)} · ${record(r)}</div></div></div>`}
function placeholder(text='TBD'){return `<div class="treePlaceholder"><div class="treeName">${esc(text)}</div></div>`}
function renderPlayoffPicture(){const el=$('#playoffView'),n=Math.max(2,Number(league.settings?.playoff_teams)||6),arr=standingsOrder().slice(0,n);if(arr.length<2){el.innerHTML='<div class="detailstatus">Keine Daten.</div>';return}if(n!==6){el.innerHTML=`<div class="playoffNote">Aktuelles Playoff Picture nach heutigem Tabellenstand · ${n} Playoff-Teams</div><div class="detailstatus">Die Turnierbaum-Ansicht ist aktuell für das in Sleeper verwendete 6-Team-Format optimiert.</div>`;return}const s1=arr[0],s2=arr[1],s3=arr[2],s4=arr[3],s5=arr[4],s6=arr[5];el.innerHTML=`<div class="playoffNote">Aktuelles Playoff Picture nach heutigem Tabellenstand · Seeds aus den Standings</div><div class="bracketScroll"><div class="tree"><div class="round"><div class="roundHead">Round 1<span>Week ${Number(league.settings?.playoff_week_start)||15}</span></div><div class="r1Body"><div class="treeMatch">${treeTeam(s1,1)}<div class="treeBye">BYE</div></div><div class="treeMatch">${treeTeam(s4,4)}${treeTeam(s5,5)}</div><div class="treeMatch">${treeTeam(s2,2)}<div class="treeBye">BYE</div></div><div class="treeMatch">${treeTeam(s6,6)}${treeTeam(s3,3)}</div></div></div><div class="round"><div class="roundHead">Round 2<span>Week ${(Number(league.settings?.playoff_week_start)||15)+1}</span></div><div class="r2Body"><div class="treeMatch">${treeTeam(s1,1)}${placeholder('Sieger Seed 4 / 5')}</div><div class="treeMatch">${treeTeam(s2,2)}${placeholder('Sieger Seed 6 / 3')}</div></div></div><div class="round"><div class="roundHead">Finals<span>Week ${(Number(league.settings?.playoff_week_start)||15)+2}</span></div><div class="finalBody"><div class="champTitle"><span>🏆</span> Championship</div><div class="champBox">${placeholder('Sieger Halbfinale 1')}${placeholder('Sieger Halbfinale 2')}</div></div></div></div></div>`}
function showStandingsMode(mode){const table=mode==='table';$('#tableView').classList.toggle('hidden',!table);$('#playoffView').classList.toggle('hidden',table);$('#tableBtn').classList.toggle('active',table);$('#playoffBtn').classList.toggle('active',!table);if(!table)renderPlayoffPicture()}
function txOwner(t){const rid=(t.roster_ids||[])[0]||Object.values(t.adds||{})[0]||Object.values(t.drops||{})[0];return rid?teamInfo(Number(rid)): {name:'Unbekannt',manager:''}}
function txTime(t){const d=new Date(Number(t.created||0));return Number.isNaN(d.getTime())?'':d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function renderActivityMove(t,p){const owner=txOwner(t),label=t.type==='waiver'?'Waiver Claim':'Free Agency';const adds=Object.entries(t.adds||{}).map(([pid])=>{const x=p[pid]||{};return `<div class="move">${imgTag(playerAsset(pid,x),'playerpic',x.full_name||[x.first_name,x.last_name].filter(Boolean).join(' ')||pid)}<div class="moveText"><div class="moveAction add">+ ADD</div><div class="moveName">${esc(x.full_name||pid)}</div><div class="moveMeta">${esc([x.position,x.team].filter(Boolean).join(' · '))}</div></div></div>`}).join('');const drops=Object.entries(t.drops||{}).map(([pid])=>{const x=p[pid]||{};return `<div class="move">${imgTag(playerAsset(pid,x),'playerpic',x.full_name||[x.first_name,x.last_name].filter(Boolean).join(' ')||pid)}<div class="moveText"><div class="moveAction drop">− DROP</div><div class="moveName">${esc(x.full_name||pid)}</div><div class="moveMeta">${esc([x.position,x.team].filter(Boolean).join(' · '))}</div></div></div>`}).join('');return `<div class="activity"><div class="activityHead"><span class="activityOwner">${esc(owner.name)}</span><span class="activityType">${label}</span><span class="activityTime">${esc(txTime(t))}</span></div><div class="moves">${adds||'<div></div>'}${drops||'<div></div>'}</div></div>`}
function renderTrade(t,p){const ids=t.roster_ids||[],teams=ids.map(rosterName).join(' ↔ ');const sides=ids.map(rid=>{const received=Object.entries(t.adds||{}).filter(([,to])=>Number(to)===Number(rid)).map(([pid])=>{const x=p[pid]||{};return `<div class="move">${imgTag(playerAsset(pid,x),'playerpic',x.full_name||[x.first_name,x.last_name].filter(Boolean).join(' ')||pid)}<div class="moveText"><div class="moveAction add">+ ERHÄLT</div><div class="moveName">${esc(x.full_name||pid)}</div><div class="moveMeta">${esc([x.position,x.team].filter(Boolean).join(' · '))}</div></div></div>`}).join('');const picks=(t.draft_picks||[]).filter(pk=>Number(pk.owner_id)===Number(rid)).map(pk=>`<div class="tradePick">${esc(pk.season+' · Runde '+pk.round)}<div class="tradePickMeta">Draft Pick</div></div>`).join('');return `<div class="tradeSide"><div class="tradeSideName">${esc(rosterName(rid))}</div>${received}${picks||''}${!received&&!picks?'<div class="moveMeta">Keine Assets erkannt</div>':''}</div>`}).join('');return `<div class="trade"><div class="activityHead"><span class="tradeTeams">${esc(teams)}</span><span class="activityType">Trade</span><span class="activityTime">${esc(txTime(t))}</span></div><div class="tradeSides">${sides}</div></div>`}
async function loadTrades(){const el=$('#trades');el.innerHTML='Trades & Activity laden …';try{const tx=await j('/league/'+LEAGUES[1]+'/transactions/'+currentWeek);const feed=(tx||[]).filter(t=>t.status==='complete'&&(t.type==='trade'||t.type==='waiver'||t.type==='free_agent')).sort((a,b)=>(b.created||0)-(a.created||0));if(!feed.length){el.innerHTML=`In Week ${currentWeek} gab es keine Trades, Waiver Claims oder Free-Agent-Aktivitäten.`;return}const p=await getPlayers();el.className='';el.innerHTML=feed.map(t=>t.type==='trade'?renderTrade(t,p):renderActivityMove(t,p)).join('')}catch(e){el.className='detailstatus';el.innerHTML=`Trades & Activity konnten nicht geladen werden: ${esc(e.message)}`}}
function moveMainNavIndicator(){const nav=document.querySelector('.mainNav'),active=nav?.querySelector('.mainNavTab.active'),ind=$('#mainNavIndicator');if(!nav||!active||!ind)return;ind.style.width=active.offsetWidth+'px';ind.style.transform=`translateX(${active.offsetLeft-3}px)`}function showLeagueView(which){const mt=which==='matchups',st=which==='standings',tr=which==='trades';$('#matchupsView').classList.toggle('hidden',!mt);$('#standingsView').classList.toggle('hidden',!st);$('#tradesView').classList.toggle('hidden',!tr);$('#matchupsTab').classList.toggle('active',mt);$('#standingsTab').classList.toggle('active',st);$('#tradesTab').classList.toggle('active',tr);requestAnimationFrame(moveMainNavIndicator);if(tr)loadTrades()}

async function init(){try{const id=LEAGUES[1];const [l,u,r,state]=await Promise.all([j('/league/'+id),j('/league/'+id+'/users'),j('/league/'+id+'/rosters'),j('/state/nfl')]);league=l;users=Object.fromEntries(u.map(x=>[x.user_id,x]));rosters=r;currentWeek=Math.max(1,Number(state.week)||1);$('#leagueName').textContent=l.name||'Company Fantasy Hub';$('#leagueMeta').textContent=`Division 1 · ${r.length} Teams · Saison ${l.season||''}`;renderStandings();$('#content').classList.remove('hidden');$('#status').classList.add('hidden');requestAnimationFrame(()=>requestAnimationFrame(moveMainNavIndicator));await loadWeek();requestAnimationFrame(moveMainNavIndicator)}catch(e){$('#status').className='status error';$('#status').innerHTML=`<b>Daten konnten nicht geladen werden.</b><br>${esc(e.name==='AbortError'?'Zeitüberschreitung beim Sleeper-Aufruf.':e.message)}`;console.error(e)}}
$('#matchupsTab').addEventListener('click',()=>showLeagueView('matchups'));$('#standingsTab').addEventListener('click',()=>showLeagueView('standings'));$('#tradesTab').addEventListener('click',()=>showLeagueView('trades'));$('#tableBtn').addEventListener('click',()=>showStandingsMode('table'));$('#playoffBtn').addEventListener('click',()=>showStandingsMode('playoffs'));window.addEventListener('resize',moveMainNavIndicator);window.addEventListener('load',()=>requestAnimationFrame(moveMainNavIndicator));document.addEventListener('DOMContentLoaded',()=>requestAnimationFrame(moveMainNavIndicator));
$('#prev').addEventListener('click',async()=>{if(currentWeek>1){currentWeek--;await loadWeek();if(!$('#tradesView').classList.contains('hidden'))await loadTrades()}});$('#next').addEventListener('click',async()=>{if(currentWeek<maxWeek){currentWeek++;await loadWeek();if(!$('#tradesView').classList.contains('hidden'))await loadTrades()}});init();
</script></body></html>
